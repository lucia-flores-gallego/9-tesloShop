<h1>Listado productos</h1>

<h3 class="text-lg">
  Total de productos
  <span class="text-secondary font-bold">
    {{ productsResource.value()?.count ?? 0 }}
  </span>
</h3>

<div class="flex flex-1">
  
</div>
<button class="btn btn-primary" routerLink="/admin/products/new">
    Nuevo producto
  </button>

<div class="flex justify-end mb-4">
  <label class="flex items-center gap-2">
    <span>Productos por página</span>
    <select
      class="select select-bordered select-sm"
      [value]="pageSize()"
      (change)="onPageSizeChange(+$any($event.target).value)"
    >
      <option value="10">10</option>
      <option value="20">20</option>
      <option value="50">50</option>
      <option value="100">100</option>
    </select>
  </label>
</div>

<div class="divider"></div>

@if (productsResource.hasValue()) {
  <product-table [products]="productsResource.value()!.products" />
}

<div class="mt-6 flex items-center justify-center gap-2">
  <button
    class="btn btn-sm"
    [disabled]="currentPage() === 1"
    (click)="prevPage()"
  >
    Anterior
  </button>

  @for (page of pages(); track page) {
    <button
      class="btn btn-sm"
      [class.btn-primary]="page === currentPage()"
      [class.btn-outline]="page !== currentPage()"
      (click)="goToPage(page)"
    >
      {{ page }}
    </button>
  }

  <button
    class="btn btn-sm"
    [disabled]="currentPage() === totalPages()"
    (click)="nextPage()"
  >
    Siguiente
  </button>
</div>
